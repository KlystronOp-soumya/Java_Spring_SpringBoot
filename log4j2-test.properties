#configuration for Log4j2
status = info
name = TodoServiceConfig

property.filename =  logs/TodoApp.log
property.pattern = %d{yyyy-MM-dd HH:mm:ss}  %c %p [%t]: %m %n

filter.threshold.type = ThresholdFilter
filter.threshold.level = info

#console appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern = %c %p : %m %n
appender.console.filter.threshold.type=ThresholdFilter
appender.console.filter.threshold.level = INFO

#RollingFile appender
appender.rolling.type = RollingFile
appender.rolling.name = DEBUGAPP
#from the properties file
appender.rolling.fileName = ${filename}
appender.rolling.filePattern = logs/rolling2/ToDo-%d{MM-dd-yy-HH-mm-ss}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = ${pattern}
appender.rolling.filter.threshold.type=ThresholdFilter
appender.rolling.filter.threshold.level = INFO
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=100MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 5



#assign packages to the appenders
#logger.rolling.name = com.demo.todoapp
#logger.rolling.level = info
#logger.rolling.additivity = false
#logger.rolling.appenderRef.rolling.ref = DEBUGAPP

logger.rolling.name = com.demo.todoapp
logger.rolling.level = info
logger.rolling.additivity = false
logger.rolling.appenderRef.rolling.ref = DEBUGAPP

logger.rolling.name = org.springframework.security
logger.rolling.level = info
logger.rolling.additivity = false
logger.rolling.appenderRef.rolling.ref = DEBUGAPP

