spring.application.name=SpringBootUnitTestings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-admin-password=root

spring.datasource.url=jdbc:h2:file:./sampledb_test;SCHEMA=ITEMDB;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.schema=ITEMDB
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.driver-class-name=org.h2.Driver
spring.datasource.hikari.jdbc-url=jdbc:h2:file:./sampledb_test;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;
spring.datasource.hikari.pool-name=MyPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.username=sa
spring.datasource.hikari.idle-timeout=50000

spring.jpa.database=H2
spring.jpa.defer-datasource-initialization=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.format-sql=true
spring.jpa.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

spring.data.jpa.repositories.bootstrap-mode=default
spring.data.jpa.repositories.enabled=true

spring.sql.init.mode=EMBEDDED
spring.sql.init.data-locations=classpath*:data.sql,schema.sql

server.port=8093
server.servlet.context-path=/

logging.level.root=INFO
logging.level.org.springframework=ERROR
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %c %p [%t]: %m %n
logging.logback.rollingpolicy.clean-history-on-start=true
logging.logback.rollingpolicy.max-file-size=40MB
